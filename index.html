  <body>
    <div id="root"></div>
    <div id="modal"></div>
    <script>
      (() => {
        let observer;

        const revealObserved = () => {
          const nodes = document.querySelectorAll(".reveal-up");

          if (!observer) {
            observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add("is-visible");
                    observer.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.18, rootMargin: "0px 0px -40px 0px" }
            );
          }

          nodes.forEach((node) => {
            if (!node.classList.contains("is-visible")) {
              observer.observe(node);
            }
          });
        };

        const enhanceRoute = () => {
          const aboutTabs = document.querySelector(".tabs > div:last-child");
          if (aboutTabs) {
            aboutTabs.classList.add("about-panel", "reveal-up");
          }

          document
            .querySelectorAll(
              ".home .container > div, .projects .group, .tabs > div:last-child, .skills .progress, #modal > div"
            )
            .forEach((node) => node.classList.add("reveal-up"));

          revealObserved();
        };

        const refresh = () => window.requestAnimationFrame(enhanceRoute);

        ["pushState", "replaceState"].forEach((method) => {
          const original = history[method];
          history[method] = function patchedHistory() {
            const result = original.apply(this, arguments);
            refresh();
            return result;
          };
        });

        window.addEventListener("popstate", refresh);

        const root = document.getElementById("root");
        const domObserver = new MutationObserver(() => refresh());
        domObserver.observe(root, { childList: true, subtree: true });

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", refresh, { once: true });
        } else {
          refresh();
        }
      })();
    </script>
